<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b4b"><meta name="description" content="കതിർ സ്വയം സഹായ സംഘത്തിന്റെ അംഗത്വം, സമ്പാദ്യം, വായ്പ, കണക്ക് എന്നിവ കൈകാര്യം ചെയ്യാനുള്ള ആപ്പ്"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png">
<title>കതിർ സ്വയം സഹായ സംഘം</title>
<style>
:root{--green:#176b4b;--pale:#eaf5ef;--line:#dce5df;--ink:#20312a;--muted:#64736b}
*{box-sizing:border-box}body{margin:0;background:#f5f8f6;color:var(--ink);font-family:system-ui,"Noto Sans Malayalam",sans-serif}
header{background:var(--green);color:white;padding:18px 16px}header h1{font-size:21px;margin:0}header p{margin:4px 0 0;font-size:13px;opacity:.9}
nav{display:flex;gap:7px;overflow:auto;padding:10px;background:white;position:sticky;top:0;border-bottom:1px solid var(--line);z-index:2}
nav button,.btn{border:0;border-radius:9px;padding:9px 12px;background:var(--pale);color:var(--green);font-weight:650;white-space:nowrap}
nav button.active,.btn.primary{background:var(--green);color:white}
main{max-width:1000px;margin:auto;padding:14px}.page{display:none}.page.active{display:block}
.card{background:white;border:1px solid var(--line);border-radius:13px;padding:14px;margin:10px 0}
h2{font-size:18px;margin:4px 0 12px}h3{font-size:15px;margin:4px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}
.metric{background:white;border:1px solid var(--line);border-radius:12px;padding:13px}.metric b{display:block;font-size:22px;color:var(--green)}.metric span{font-size:12px;color:var(--muted)}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd8d0;border-radius:8px;background:white;font:inherit;margin:4px 0 9px}
label{font-size:13px;color:var(--muted)}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.loan-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;align-items:start}.loan-form-grid>div{min-width:0}.loan-form-grid label{display:block;min-height:2.5em}.loan-form-grid input,.loan-form-grid select{width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--muted);font-weight:650}
.tablewrap{overflow:auto}.muted{color:var(--muted);font-size:13px}.danger{color:#a33}.small{font-size:12px}
.actions{display:flex;gap:7px;flex-wrap:wrap}.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:var(--pale);color:var(--green);font-size:12px}
.empty{padding:15px;text-align:center;color:var(--muted)}button{cursor:pointer}
@media(max-width:560px){main{padding:9px}.card{padding:11px}th,td{padding:8px 4px}}
</style></head>
<body>
<header><h1>കതിർ സ്വയം സഹായ സംഘം</h1><p>സംഘത്തിന്റെ അംഗത്വം · സമ്പാദ്യം · വായ്പ · കണക്ക്</p></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const KEY='kathir_app_data_v3';
const defaults={members:[],savings:[],loans:[],meetings:[],transactions:[],investments:[],settings:{weekly:200,savingFine:50,loanRate:10,loanWeeks:20,attendanceFineOn:false,attendanceFine:50}};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch(e){db=structuredClone(defaults)}
db.settings={...defaults.settings,...(db.settings||{})};
let page='home';
let savingsFocusDate='';
let editingSavingId='';
let editingTransactionId='';
let meetingSections={};
const pages=[['home','ഹോം'],['members','അംഗങ്ങൾ'],['savings','ആഴ്ച സമ്പാദ്യം'],['loans','വായ്പകൾ'],['meetings','യോഗം'],['accounts','വരവ്-ചെലവ്'],['investments','നിക്ഷേപം'],['backup','ബാക്കപ്പ്'],['settings','ക്രമീകരണം'],['rules','നിയമങ്ങൾ']];
const $=s=>document.querySelector(s), money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2});
function formatDateDisplay(v){if(!v||v==='-')return v||'-';const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:String(v)}
function loanDueDate(loan){const m=String(loan?.created||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return '-';const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));d.setDate(d.getDate()+(Number(loan.weeks)||20)*7);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseDateDisplay(v){v=String(v||'').trim();if(!v)return '';let m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);if(m){const d=Number(m[1]),mo=Number(m[2]),y=Number(m[3]),dt=new Date(y,mo-1,d);if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return '';return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`}if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;return ''}
function formatTimeDisplay(v){
 if(v==null||v===''||v==='രേഖപ്പെടുത്തിയിട്ടില്ല')return v||'';
 let s=String(v).trim();
 let m=s.match(/(?:^|T)(\d{1,2}):(\d{2})(?::(\d{2})(?:\.\d+)?)?(?:Z|[+-]\d{2}:?\d{2})?$/i);
 if(!m){
   const twelve=s.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
   if(twelve){let h=Number(twelve[1]),mi=Number(twelve[2]);if(h>=1&&h<=12&&mi<=59)return `${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')} ${twelve[3].toUpperCase()}`;}
   return s;
 }
 let h=Number(m[1]),mi=Number(m[2]);
 if(h>23||mi>59)return s;
 const ap=h>=12?'PM':'AM';h=h%12||12;
 return `${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')} ${ap}`;
}
function parseTimeDisplay(v){v=String(v||'').trim().toUpperCase().replace(/\s+/g,' ');if(!v)return '';let m=v.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/);if(m){let h=Number(m[1]),mi=Number(m[2]);if(h<1||h>12||mi>59)return '';h=h%12+(m[3]==='PM'?12:0);return `${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`}m=v.match(/^(\d{1,2}):(\d{2})$/);if(m&&Number(m[1])<24&&Number(m[2])<60)return `${String(Number(m[1])).padStart(2,'0')}:${m[2]}`;return ''}
function formatDateTimeInputs(){document.querySelectorAll('#app input[type="date"]').forEach(el=>{el.lang='en-GB';el.setAttribute('aria-label','തീയതി തിരഞ്ഞെടുക്കുക');});document.querySelectorAll('#app input[type="time"]').forEach(el=>{el.lang='en-US';el.setAttribute('aria-label','സമയം തിരഞ്ഞെടുക്കുക');});}

function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nav(){ $('#nav').innerHTML=pages.map(([id,n])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${n}</button>`).join('')}
function go(p){page=p;render()}
function memberName(id){return db.members.find(m=>m.id===id)?.name||'നീക്കംചെയ്ത അംഗം'}
function sum(a,fn){return a.reduce((t,x)=>t+fn(x),0)}
function formField(label,id,type='text',value='',extra=''){return `<label>${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}>`}
function showMeetingSection(mid,section){meetingSections[mid]=section;render()}
function meetingSavingsPanel(mt){
 const today=mt.date||new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
 if(!db.members.length)return '<p class="empty">ആദ്യം അംഗങ്ങളെ ചേർക്കുക</p>';
 return `<p class="muted">ഈ യോഗത്തിൽ ഓരോ അംഗത്തിന്റെയും ആഴ്ച സമ്പാദ്യം നിലവിലുള്ള അതേ രീതിയിൽ രേഖപ്പെടുത്താം. തീയതി യോഗത്തിന്റെ തീയതിയായി നൽകിയിട്ടുണ്ട്; ആവശ്യമെങ്കിൽ മാറ്റാം.</p><div class="tablewrap"><table><thead><tr><th>അംഗം</th><th>മുൻ കുടിശ്ശിക</th><th>കുടിശ്ശിക അടവ്</th><th>ഈ ആഴ്ച സമ്പാദ്യം</th><th>ഈ ആഴ്ച പിഴ</th><th>തീയതി</th><th>ആകെ</th><th>സ്ഥിതി</th></tr></thead><tbody>
 ${db.members.map((m,i)=>{const x=db.savings.find(z=>z.member===m.id&&z.date===today);const due=sum(db.savings.filter(z=>z.member===m.id&&!z.paid&&z.date<today),z=>Math.max(0,Number(z.amount||0)+Number(z.fine||0)-Number(z.arrearsPaid||0)));const a=x?Number(x.arrearsPayment||0):0,amount=x?Number(x.amount||0):0,fine=x?Number(x.fine||0):0;const prefix='wk_'+m.id,locked=!!(x&&x.paid)||(!!mt.closed&&!mt.editing);return `<tr><td><b>${i+1}. ${esc(m.name)}</b></td><td>${money(due)}</td><td><input style="min-width:95px" type="number" min="0" step="0.01" id="${prefix}_arrears" value="${a}" ${locked?'disabled':''}></td><td><input style="min-width:95px" type="number" min="0" step="0.01" id="${prefix}_amount" value="${amount}" ${locked?'disabled':''}></td><td><input style="min-width:85px" type="number" min="0" step="0.01" id="${prefix}_fine" value="${fine}" ${locked?'disabled':''}></td><td><input style="min-width:135px" type="date" id="${prefix}_date" value="${x?x.date:today}" ${locked?'disabled':''}></td><td><b>${money(a+amount+fine)}</b></td><td>${x&&x.paid?`<span class="pill">പൂർത്തിയായി</span><br><button class="btn" onclick="editWeeklySaving('${x.id}')">എഡിറ്റ്</button>`:(mt.closed&&!mt.editing)?'<span class="pill">യോഗം അവസാനിച്ചു</span>':`<button class="btn primary" onclick="completeWeeklySaving('${m.id}','${x?x.id:''}')">✓ പൂർത്തിയാക്കുക</button>`}</td></tr>`}).join('')}
 </tbody></table></div>`;
}
function meetingNewLoanPanel(mt,locked){
 const suffix=mt.id;
 if(!db.members.length)return '<p class="empty">ആദ്യം അംഗങ്ങളെ ചേർക്കുക</p>';
 return `<p class="muted">ഈ യോഗത്തിൽ അനുവദിക്കുന്ന പുതിയ വായ്പയുടെ വിവരങ്ങൾ നൽകുക.</p><div class="loan-form-grid"><div><label>അംഗത്തിന്റെ പേര്</label><select id="lmember_${suffix}" ${locked?'disabled':''}>${db.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div><div>${formField('വായ്പ എടുത്ത തീയതി','lloandate_'+suffix,'date',mt.date||new Date().toISOString().slice(0,10),locked?'disabled':'')}</div><div>${formField('വായ്പ എടുത്ത തുക (₹)','lamount_'+suffix,'number','5000',locked?'disabled':'min="1"')}</div><div>${formField('പലിശ ശതമാനം (%)','lrate_'+suffix,'number',db.settings.loanRate,locked?'disabled':'min="0"')}</div><div>${formField('കാലാവധി (ആഴ്ച)','lweeks_'+suffix,'number',db.settings.loanWeeks,locked?'disabled':'min="1"')}</div></div><button class="btn primary" ${locked?'disabled':''} onclick="addLoan('${suffix}')">വായ്പ ചേർക്കുക</button>`;
}
function meetingRepaymentPanel(mt,locked){
 const active=db.loans.filter(l=>Math.max(0,l.total-sum(l.payments||[],p=>Number(p.amount)||0))>0.009);
 if(!active.length)return '<p class="empty">തിരിച്ചടയ്ക്കാനുള്ള വായ്പകൾ നിലവിലില്ല.</p>';
 const suffix=mt.id;
 return `<p class="muted">അംഗത്തെ തിരഞ്ഞെടുക്കുമ്പോൾ ആ വായ്പയുടെ ബാക്കി തുക സ്വയം കാണിക്കും. അടവ് തീയതിയായി യോഗത്തിന്റെ തീയതി നൽകിയിട്ടുണ്ട്; ആവശ്യമെങ്കിൽ മാറ്റാം.</p><div class="loan-form-grid"><div><label>അംഗത്തിന്റെ പേര്</label><select id="rloan_${suffix}" ${locked?'disabled':''} onchange="updateRepaymentBalance('${suffix}')">${active.map(l=>`<option value="${l.id}">${esc(memberName(l.member))}</option>`).join('')}</select></div><div><label>ബാക്കി അടയ്ക്കാനുള്ള തുക (₹)</label><input id="rbalance_${suffix}" type="text" value="${money(Math.max(0,active[0].total-sum(active[0].payments||[],p=>Number(p.amount)||0)))}" readonly></div><div>${formField('അടയ്ക്കുന്ന തുക (₹)','ramount_'+suffix,'number','',locked?'disabled':'min="0.01" step="0.01"')}</div><div>${formField('അടയ്ക്കുന്ന തീയതി','rdate_'+suffix,'date',mt.date||new Date().toISOString().slice(0,10),locked?'disabled':'')}</div></div><button class="btn primary" ${locked?'disabled':''} onclick="addLoanRepayment('${suffix}')">തിരിച്ചടവ് രേഖപ്പെടുത്തുക</button>`;
}
function render(){
 nav();let out='';
 if(page==='home'){
 const arrears=sum(db.savings.filter(x=>!x.paid),x=>Math.max(0,Number(x.amount||0)+Number(x.fine||0)-Number(x.arrearsPaid||0)));
 const outstanding=sum(db.loans,l=>Math.max(0,l.total-sum(l.payments||[],p=>p.amount)));
 const income=sum(db.transactions.filter(t=>t.kind==='income'),t=>t.amount),expense=sum(db.transactions.filter(t=>t.kind==='expense'),t=>t.amount);
 out=`<h2>സംഘത്തിന്റെ സംഗ്രഹം</h2><div class="grid">
 <div class="metric"><b>${db.members.length}</b><span>നിലവിലെ അംഗങ്ങൾ</span></div>
 <div class="metric"><b>${money(arrears)}</b><span>സമ്പാദ്യ കുടിശ്ശികയും പിഴയും</span></div>
 <div class="metric"><b>${money(outstanding)}</b><span>തിരിച്ചടയ്ക്കാനുള്ള വായ്പ</span></div>
 <div class="metric"><b>${money(income-expense)}</b><span>രേഖപ്പെടുത്തിയ വരവ് - യഥാർത്ഥ ചെലവ്</span></div></div>
 <div class="card"><h3>വേഗത്തിലുള്ള കുറിപ്പ്</h3><p class="muted">ആഴ്ച സമ്പാദ്യം: ${money(db.settings.weekly)} · അടയ്ക്കാത്ത ഓരോ ആഴ്ചയ്ക്കുമുള്ള പിഴ: ${money(db.settings.savingFine)}</p><p class="muted">ഈ പതിപ്പ് ഈ ഉപകരണത്തിലെ ബ്രൗസറിൽ മാത്രം വിവരങ്ങൾ സൂക്ഷിക്കുന്നു. ക്ലൗഡ് സിങ്ക്, അംഗങ്ങളുടെ ലോഗിൻ, പല ഉപയോക്താക്കളുടെ അനുമതികൾ എന്നിവ ഇതിലില്ല.</p></div>`;
 }else if(page==='members'){
 out=`<h2>അംഗങ്ങൾ</h2><div class="card"><h3>പുതിയ അംഗത്തെ ചേർക്കുക</h3><div class="row">${formField('അംഗത്തിന്റെ പേര്','mname')}${formField('ഫോൺ നമ്പർ (ഐച്ഛികം)','mphone','tel')}${formField('ചേർന്ന തീയതി','mjoindate','date',new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10))}<div><label>സംഘത്തിലെ സ്ഥാനം</label><select id="mrole"><option value="member">അംഗം</option><option value="president">പ്രസിഡന്റ്</option><option value="secretary">സെക്രട്ടറി</option><option value="treasurer">ട്രഷറർ</option></select></div></div><button class="btn primary" onclick="addMember()">അംഗത്തെ ചേർക്കുക</button></div><div class="card"><div class="tablewrap"><table><tr><th>നമ്പർ</th><th>പേര്</th><th>ഫോൺ</th><th>ചേർന്ന തീയതി</th><th>സംഘത്തിലെ സ്ഥാനം</th><th></th></tr>${db.members.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(m.name)}</td><td>${esc(m.phone||'-')}</td><td>${esc(formatDateDisplay(m.joinDate||'-'))}</td><td><select aria-label="${esc(m.name)}യുടെ സ്ഥാനം" onchange="updateMemberRole('${m.id}',this.value)"><option value="member" ${(m.role||'member')==='member'?'selected':''}>അംഗം</option><option value="president" ${m.role==='president'?'selected':''}>പ്രസിഡന്റ്</option><option value="secretary" ${m.role==='secretary'?'selected':''}>സെക്രട്ടറി</option><option value="treasurer" ${m.role==='treasurer'?'selected':''}>ട്രഷറർ</option></select></td><td><button class="btn" onclick="removeMember('${m.id}')">നീക്കുക</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">അംഗങ്ങളില്ല</td></tr>'}</table></div><p class="muted">സ്ഥാനം മാറ്റാൻ പട്ടികയിലെ സ്ഥാനത്തിന്റെ ഓപ്ഷൻ മാറ്റിയാൽ മതി. നമ്പറുകൾ പട്ടികയിലെ ക്രമത്തിൽ സ്വയം വരും.</p></div>`;
 }else if(page==='savings'){

function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function val(x){const el=$('#'+x);if(!el)return '';return el.value??'';}
function addMember(){let n=val('mname').trim(),d=val('mjoindate');if(!n)return alert('പേര് നൽകുക');if(!d)return alert('ചേർന്ന തീയതി തിരഞ്ഞെടുക്കുക');db.members.push({id:id(),name:n,phone:val('mphone'),joinDate:d,role:val('mrole')||'member'});save()}
function updateMemberRole(i,role){let m=db.members.find(x=>x.id===i);if(!m)return;m.role=role;save()}
function removeMember(i){if(confirm('ഈ അംഗത്തെ പട്ടികയിൽ നിന്ന് നീക്കണോ? പഴയ ഇടപാട് രേഖകൾ നിലനിൽക്കും.')){db.members=db.members.filter(m=>m.id!==i);save()}}
function completeWeeklySaving(member,existingId){
 const p='wk_'+member,d=val(p+'_date'),amount=Number(val(p+'_amount')),fine=Number(val(p+'_fine')),arrearsPayment=Number(val(p+'_arrears'));
 if(!d||![amount,fine,arrearsPayment].every(n=>Number.isFinite(n)&&n>=0))return alert('തീയതിയും തുകയും ശരിയായി നൽകുക');
 let x=existingId?db.savings.find(z=>z.id===existingId):null;
 if(x&&x.paid)return alert('ഇത് ഇതിനകം പൂർത്തിയാക്കിയതാണ്');
 if(!x){if(db.savings.some(z=>z.member===member&&z.date===d))return alert('ഈ തീയതിയിൽ ഈ അംഗത്തിന് രേഖ നിലവിലുണ്ട്');x={id:id(),member,date:d,amount:0,fine:0,paid:false};db.savings.push(x)}else if(db.savings.some(z=>z.id!==x.id&&z.member===member&&z.date===d))return alert('ഈ തീയതിയിൽ ഈ അംഗത്തിന് മറ്റൊരു രേഖ നിലവിലുണ്ട്');
 const due=sum(db.savings.filter(z=>z.id!==x.id&&z.member===member&&!z.paid&&z.date<d),z=>Math.max(0,Number(z.amount||0)+Number(z.fine||0)-Number(z.arrearsPaid||0)));
 if(arrearsPayment>due+0.009)return alert('നൽകിയ കുടിശ്ശിക അടവ് നിലവിലുള്ള കുടിശ്ശികയെക്കാൾ കൂടുതലാണ്: '+money(due));
 x.date=d;x.amount=amount;x.fine=fine;x.arrearsPayment=arrearsPayment;x.arrearsAllocations=[];savingsFocusDate=d;
 let remaining=arrearsPayment;
 const debts=db.savings.filter(z=>z.id!==x.id&&z.member===member&&!z.paid&&z.date<d).sort((a,b)=>a.date.localeCompare(b.date));
 for(const debt of debts){let left=Math.max(0,Number(debt.amount||0)+Number(debt.fine||0)-Number(debt.arrearsPaid||0));let take=Math.min(left,remaining);if(take>0){debt.arrearsPaid=Number(debt.arrearsPaid||0)+take;x.arrearsAllocations.push({id:debt.id,amount:take});remaining-=take}if(remaining<=0.009)break}
 x.paid=true;save();
}
function editWeeklySaving(i){
 const x=db.savings.find(z=>z.id===i);if(!x){alert('ഈ ഇടപാട് കണ്ടെത്താനായില്ല');return;}
 editingSavingId=i;page='savings';render();setTimeout(()=>document.getElementById('savingEditor')?.scrollIntoView({behavior:'smooth',block:'start'}),50);
}
function rebuildSavingsArrears(){
 for(const x of db.savings){x.arrearsPaid=0;x.arrearsAllocations=[];}
 const paid=db.savings.filter(x=>x.paid).slice().sort((a,b)=>a.date.localeCompare(b.date));
 for(const x of paid){let remaining=Math.max(0,Number(x.arrearsPayment||0));
  const debts=db.savings.filter(z=>z.id!==x.id&&z.member===x.member&&!z.paid&&z.date<x.date).sort((a,b)=>a.date.localeCompare(b.date));
  for(const debt of debts){const left=Math.max(0,Number(debt.amount||0)+Number(debt.fine||0)-Number(debt.arrearsPaid||0));const take=Math.min(left,remaining);if(take>0){debt.arrearsPaid+=take;x.arrearsAllocations.push({id:debt.id,amount:take});remaining-=take;}if(remaining<=0.009)break;}
 }
}
function saveWeeklySavingEdit(){
 const x=db.savings.find(z=>z.id===editingSavingId);if(!x)return alert('ഇടപാട് കണ്ടെത്താനായില്ല');
 const d=val('editSavingDate'),amount=Number(val('editSavingAmount')),fine=Number(val('editSavingFine')),arrearsPayment=Number(val('editSavingArrears'));
 if(!d||![amount,fine,arrearsPayment].every(n=>Number.isFinite(n)&&n>=0))return alert('തീയതിയും തുകയും ശരിയായി നൽകുക');
 if(db.savings.some(z=>z.id!==x.id&&z.member===x.member&&z.date===d))return alert('ഈ തീയതിയിൽ ഈ അംഗത്തിന് മറ്റൊരു ഇടപാട് നിലവിലുണ്ട്.');
 const old={date:x.date,amount:x.amount,fine:x.fine,arrearsPayment:x.arrearsPayment};
 x.date=d;x.amount=amount;x.fine=fine;x.arrearsPayment=arrearsPayment;
 rebuildSavingsArrears();
 const allocated=sum(x.arrearsAllocations||[],a=>Number(a.amount||0));
 if(x.paid&&arrearsPayment>allocated+0.009){Object.assign(x,old);rebuildSavingsArrears();return alert('ഈ തീയതിവരെ അടയ്ക്കാനുള്ള പഴയ കുടിശ്ശികയെക്കാൾ കൂടുതലാണ് കുടിശ്ശിക അടവ്. ലഭ്യമായ കുടിശ്ശിക: '+money(allocated));}
 editingSavingId='';savingsFocusDate=d;save();alert('ഇടപാട് തിരുത്തി സേവ് ചെയ്തു.');
}
function cancelWeeklySavingEdit(){editingSavingId='';render();}
function deleteWeeklySaving(i){
 const x=db.savings.find(z=>z.id===i);if(!x)return alert('ഇടപാട് കണ്ടെത്താനായില്ല');
 if(!confirm(memberName(x.member)+' എന്ന അംഗത്തിന്റെ '+formatDateDisplay(x.date)+' തീയതിയിലെ ഈ സമ്പാദ്യ ഇടപാട് പൂർണമായി ഡിലീറ്റ് ചെയ്യട്ടേ? ഇതുമായി ബന്ധപ്പെട്ട കുടിശ്ശിക കണക്കുകൾ വീണ്ടും ക്രമീകരിക്കും.'))return;
 db.savings=db.savings.filter(z=>z.id!==i);if(editingSavingId===i)editingSavingId='';rebuildSavingsArrears();save();alert('ഇടപാട് ഡിലീറ്റ് ചെയ്തു.');
}
function addLoan(suffix){let principal=Number(val('lamount_'+suffix)),rate=Number(val('lrate_'+suffix)),weeks=Number(val('lweeks_'+suffix)),member=val('lmember_'+suffix),date=val('lloandate_'+suffix);if(!member||principal<=0||weeks<=0||rate<0||!date)return alert('വിവരങ്ങൾ ശരിയായി നൽകുക');if(!confirm(memberName(member)+' എന്ന അംഗത്തിന് '+money(principal)+' വായ്പ '+formatDateDisplay(date)+' തീയതിയിൽ ചേർക്കട്ടേ?'))return;let interest=principal*rate/100;db.loans.push({id:id(),member,principal,rate,weeks,total:principal+interest,created:date,payments:[]});save();alert('പുതിയ വായ്പ രേഖപ്പെടുത്തി.')}
function updateRepaymentBalance(suffix){let loanId=val('rloan_'+suffix),l=db.loans.find(x=>x.id===loanId);if(!l)return;let paid=sum(l.payments||[],p=>Number(p.amount)||0),balance=Math.max(0,l.total-paid),field=document.getElementById('rbalance_'+suffix);if(field)field.value=money(balance)}
function addLoanRepayment(suffix){let loanId=val('rloan_'+suffix),l=db.loans.find(x=>x.id===loanId);if(!l)return alert('വായ്പ തിരഞ്ഞെടുക്കുക');let amount=Number(val('ramount_'+suffix)),date=val('rdate_'+suffix),paid=sum(l.payments||[],p=>Number(p.amount)||0),balance=Math.max(0,l.total-paid);if(!Number.isFinite(amount)||amount<=0||amount>balance||!date)return alert('തുകയും തീയതിയും ശരിയായി നൽകുക. ബാക്കി തുക: '+money(balance));if(!confirm(memberName(l.member)+' എന്ന അംഗത്തിന്റെ '+formatDateDisplay(date)+' തീയതിയിലെ '+money(amount)+' തിരിച്ചടവ് രേഖപ്പെടുത്തട്ടേ?'))return;l.payments=l.payments||[];l.payments.push({id:id(),date,amount});save();alert('വായ്പ തിരിച്ചടവ് രേഖപ്പെടുത്തി.')}
function repay(i){let l=db.loans.find(x=>x.id===i);if(!l)return;let paid=sum(l.payments||[],p=>Number(p.amount)||0),bal=l.total-paid;if(bal<=0)return alert('വായ്പ പൂർണ്ണമായി അടച്ചു');let a=Number(prompt('അടച്ച തുക നൽകുക. ബാക്കി: '+money(bal)));if(!Number.isFinite(a)||a<=0||a>bal)return alert('ശരിയായ തുക നൽകുക');let date=prompt('അടവ് അടച്ച തീയതി (DD/MM/YYYY)',formatDateDisplay(new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)));date=parseDateDisplay(date);if(!date)return alert('ശരിയായ തീയതി നൽകുക');if(!confirm(formatDateDisplay(date)+' തീയതിയിൽ '+money(a)+' അടവ് രേഖപ്പെടുത്തട്ടേ?'))return;l.payments=l.payments||[];l.payments.push({id:id(),date,amount:a});save()}
function editLoan(i){let l=db.loans.find(x=>x.id===i);if(!l)return;let principal=Number(prompt('വായ്പ തുക (₹)',l.principal));if(!Number.isFinite(principal)||principal<=0)return alert('ശരിയായ വായ്പ തുക നൽകുക');let rate=Number(prompt('പലിശ %',l.rate));if(!Number.isFinite(rate)||rate<0)return alert('ശരിയായ പലിശ നൽകുക');let weeks=Number(prompt('കാലാവധി (ആഴ്ച)',l.weeks));if(!Number.isInteger(weeks)||weeks<1)return alert('ശരിയായ കാലാവധി നൽകുക');let date=prompt('വായ്പ എടുത്ത തീയതി (DD/MM/YYYY)',formatDateDisplay(l.created||''));date=parseDateDisplay(date);if(!date)return alert('ശരിയായ തീയതി നൽകുക');let total=principal+principal*rate/100,paid=sum(l.payments||[],p=>Number(p.amount)||0);if(total+0.009<paid)return alert('പുതിയ വായ്പയുടെ ആകെ തുക ഇതിനകം അടച്ച തുകയേക്കാൾ കുറവാകാൻ പാടില്ല: '+money(paid));if(!confirm('വായ്പയുടെ വിവരങ്ങൾ തിരുത്തി സേവ് ചെയ്യട്ടേ?'))return;l.principal=principal;l.rate=rate;l.weeks=weeks;l.total=total;l.created=date;save()}
function deleteLoan(i){let l=db.loans.find(x=>x.id===i);if(!l)return;let paid=sum(l.payments||[],p=>Number(p.amount)||0),count=(l.payments||[]).length;let message=memberName(l.member)+' എന്ന അംഗത്തിന്റെ '+money(l.principal)+' വായ്പ ഡിലീറ്റ് ചെയ്യട്ടേ?';if(count)message+='\n\nഈ വായ്പയോടൊപ്പം '+count+' അടവ് രേഖകളും (മൊത്തം '+money(paid)+') ഡിലീറ്റ് ആകും.';message+='\n\nഈ നടപടി തിരികെ മാറ്റാൻ കഴിയില്ല.';if(!confirm(message))return;db.loans=db.loans.filter(x=>x.id!==i);save();alert('വായ്പയും ബന്ധപ്പെട്ട അടവ് രേഖകളും ഡിലീറ്റ് ചെയ്തു.')}
function editLoanPayment(i,idx){let l=db.loans.find(x=>x.id===i),p=l?.payments?.[idx];if(!p)return;let amount=Number(prompt('തിരുത്തിയ അടച്ച തുക (₹)',p.amount));if(!Number.isFinite(amount)||amount<=0)return alert('ശരിയായ തുക നൽകുക');let date=prompt('അടവ് തീയതി (DD/MM/YYYY)',formatDateDisplay(p.date||''));date=parseDateDisplay(date);if(!date)return alert('ശരിയായ തീയതി നൽകുക');let other=sum(l.payments.filter((x,n)=>n!==idx),x=>Number(x.amount)||0);if(other+amount>l.total+0.009)return alert('അടച്ച മൊത്തം തുക വായ്പയുടെ ആകെ തുകയെക്കാൾ കൂടുതലാകരുത്. അനുവദിക്കാവുന്ന പരമാവധി: '+money(l.total-other));if(!confirm('ഈ അടവ് '+money(amount)+' ആയി തിരുത്തി സേവ് ചെയ്യട്ടേ?'))return;p.amount=amount;p.date=date;save()}
function deleteLoanPayment(i,idx){let l=db.loans.find(x=>x.id===i),p=l?.payments?.[idx];if(!p)return;if(!confirm(formatDateDisplay(p.date||'')+' തീയതിയിലെ '+money(p.amount)+' അടവ് രേഖ നീക്കം ചെയ്യട്ടേ?'))return;l.payments.splice(idx,1);save()}
function addMeeting(){const date=val('meetdate'),place=val('meetplace').trim(),time=val('meettime');if(!date||!place||!time)return alert('യോഗത്തിന്റെ തീയതി, സ്ഥലം, സമയം എന്നിവ മൂന്നും നൽകണം.');if(!confirm('ഈ തീയതി, സ്ഥലം, സമയം എന്നിവയോടെ പുതിയ യോഗം സൃഷ്ടിക്കട്ടേ?'))return;db.meetings.push({id:id(),date,place,time,closed:false,editing:false,fineOn:db.settings.attendanceFineOn,fineAmount:Number(db.settings.attendanceFine),attendance:db.members.map(m=>({member:m.id,status:'unmarked'}))});save()}

function deleteMeeting(mid){const mt=db.meetings.find(x=>x.id===mid);if(!mt)return;if(!confirm(formatDateDisplay(mt.date||'ഈ')+' തീയതിയിലെ യോഗം പൂർണമായി ഡിലീറ്റ് ചെയ്യട്ടേ?'))return;db.meetings=db.meetings.filter(x=>x.id!==mid);save()}
function editMeeting(mid){const mt=db.meetings.find(x=>x.id===mid);if(!mt)return;if(!confirm('സെക്രട്ടറിയായി ഈ യോഗത്തിന്റെ വിവരങ്ങളും ഹാജരും തിരുത്താൻ അനുവദിക്കട്ടേ?'))return;mt.editing=true;save()}
function saveMeetingEdit(mid){const mt=db.meetings.find(x=>x.id===mid);if(!mt||!mt.editing)return;const date=val('medate_'+mid),place=val('meplace_'+mid).trim(),time=val('metime_'+mid);if(!date||!place||!time)return alert('തീയതി, സ്ഥലം, സമയം എന്നിവ നൽകണം.');if(!confirm('തിരുത്തിയ വിവരങ്ങൾ സേവ് ചെയ്യട്ടേ?'))return;mt.date=date;mt.place=place;mt.time=time;mt.editing=false;save()}
function addTransaction(){let amount=Number(val('tamount')),kind=val('tkind'),date=val('tdate'),desc=val('tdesc').trim();if(!Number.isFinite(amount)||amount<=0||!date)return alert('തുകയും തീയതിയും ശരിയായി നൽകുക');if(!confirm((kind==='income'?'വരവ്':'യഥാർത്ഥ ചെലവ്')+' ആയി '+money(amount)+' തുക '+formatDateDisplay(date)+' തീയതിയിൽ രേഖപ്പെടുത്തട്ടേ?'))return;db.transactions.push({id:id(),kind,amount,date,desc});save();alert('ഇടപാട് രേഖപ്പെടുത്തി.')}
function editTransaction(i){if(!db.transactions.some(t=>t.id===i))return alert('ഇടപാട് കണ്ടെത്താനായില്ല');editingTransactionId=i;render()}
function cancelTransactionEdit(){editingTransactionId='';render()}
function saveTransactionEdit(){let t=db.transactions.find(x=>x.id===editingTransactionId);if(!t)return alert('ഇടപാട് കണ്ടെത്താനായില്ല');let amount=Number(val('editTamount')),kind=val('editTkind'),date=val('editTdate'),desc=val('editTdesc').trim();if(!Number.isFinite(amount)||amount<=0||!date)return alert('തുകയും തീയതിയും ശരിയായി നൽകുക');if(!confirm('ഈ ഇടപാടിന്റെ വിവരങ്ങൾ തിരുത്തി സേവ് ചെയ്യട്ടേ?'))return;t.amount=amount;t.kind=kind;t.date=date;t.desc=desc;editingTransactionId='';save();alert('ഇടപാട് തിരുത്തി സേവ് ചെയ്തു.')}
function deleteTransaction(i){let t=db.transactions.find(x=>x.id===i);if(!t)return alert('ഇടപാട് കണ്ടെത്താനായില്ല');if(!confirm(formatDateDisplay(t.date)+' തീയതിയിലെ '+(t.kind==='income'?'വരവ്':'ചെലവ്')+' '+money(t.amount)+' ഇടപാട് നീക്കം ചെയ്യട്ടേ? ഈ നടപടി തിരികെ മാറ്റാൻ കഴിയില്ല.'))return;db.transactions=db.transactions.filter(x=>x.id!==i);if(editingTransactionId===i)editingTransactionId='';save();alert('ഇടപാട് നീക്കം ചെയ്തു.')}
function addInvestment(){let amount=Number(val('iamount'));if(amount<=0)return alert('തുക നൽകുക');db.investments.push({id:id(),amount,date:val('idate'),desc:val('idesc')});save()}
function saveSettings(){db.settings={weekly:Number(val('setweekly')),savingFine:Number(val('setfine')),loanRate:Number(val('setrate')),loanWeeks:Number(val('setweeks')),attendanceFine:Number(val('setattfine')),attendanceFineOn:$('#setatton').checked};if(db.settings.weekly<0||db.settings.savingFine<0||db.settings.loanRate<0||db.settings.loanWeeks<1)return alert('ക്രമീകരണങ്ങൾ പരിശോധിക്കുക');save()}
function downloadBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kathir-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function restoreBackup(){let f=$('#backupfile').files[0];if(!f)return alert('ഫയൽ തിരഞ്ഞെടുക്കുക');let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.members||!d.settings)throw 0;if(confirm('ഇപ്പോഴുള്ള ഡാറ്റ മാറ്റിസ്ഥാപിക്കട്ടേ?')){db=d;db.settings={...defaults.settings,...db.settings};save()}}catch(e){alert('ഈ ബാക്കപ്പ് ഫയൽ വായിക്കാൻ കഴിയില്ല')}};r.readAsText(f)}
render();
</script>
